<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Style guide — Linear Algebra Seen Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ============================================================
     Style guide local styles
     The page itself follows the same design language it documents.
     ============================================================ */

  html, body { background: var(--bg); color: var(--ink); }
  body {
    margin: 0;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Vector palette tokens — Plate. Reproduced here so the guide stands alone
     without depending on consumer files. Move these into app/styles.css to
     adopt the palette globally. */
  :root {
    --v1:      #b14233;
    --v1-wash: rgba(177,66,51,0.11);
    --v1-edge: rgba(177,66,51,0.40);
    --v2:      #1f4a73;
    --v2-wash: rgba(31,74,115,0.11);
    --v2-edge: rgba(31,74,115,0.40);
    --v3:      #a07321;
    --v3-wash: rgba(160,115,33,0.12);
    --v3-edge: rgba(160,115,33,0.40);
    --vp:      #3d5e2b;
    --vp-wash: rgba(61,94,43,0.12);
    --vp-edge: rgba(61,94,43,0.42);
  }

  /* Page chrome */
  .sg-shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 80px 56px 120px;
  }
  .sg-cover { margin-bottom: 80px; }
  .sg-cover .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .sg-cover h1 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 56px; letter-spacing: -0.03em; line-height: 1.02;
    margin: 14px 0 18px; color: var(--ink);
  }
  .sg-cover .lede {
    font-family: var(--font-math);
    font-size: 19px; line-height: 1.55; color: var(--ink-2);
    max-width: 60ch; margin: 0;
  }
  .sg-cover .meta-row {
    display: flex; flex-wrap: wrap; gap: 22px;
    margin-top: 28px;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--ink-3); letter-spacing: 0.02em;
  }
  .sg-cover .meta-row .k { color: var(--ink-3); }
  .sg-cover .meta-row .v { color: var(--ink); margin-left: 6px; }

  /* Table of contents */
  .sg-toc {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    margin-top: 36px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .sg-toc a {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
  }
  .sg-toc a:last-child, .sg-toc a:nth-last-child(2) { border-bottom: none; }
  .sg-toc a:nth-child(odd) { padding-right: 24px; }
  .sg-toc a:nth-child(even) { padding-left: 24px; border-left: 1px solid var(--line); }
  .sg-toc .n {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.06em; color: var(--ink-3);
    width: 28px; flex-shrink: 0;
  }
  .sg-toc .l {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 15px; color: var(--ink); letter-spacing: -0.01em;
  }
  .sg-toc .d {
    font-family: var(--font-math);
    font-size: 13px; color: var(--ink-3);
    margin-left: auto;
  }

  /* Sections */
  .sg-section { margin: 72px 0; scroll-margin-top: 20px; }
  .sg-section:first-of-type { margin-top: 0; }
  .sg-section > header {
    display: flex; flex-direction: column; gap: 8px;
    padding-bottom: 22px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
  }
  .sg-section > header .num {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .sg-section > header h2 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 30px; letter-spacing: -0.025em; line-height: 1.1;
    margin: 4px 0 0; color: var(--ink);
  }
  .sg-section > header p {
    font-family: var(--font-math); font-size: 15.5px;
    line-height: 1.55; color: var(--ink-2);
    max-width: 64ch; margin: 8px 0 0;
  }

  /* Sub-headings inside a section */
  .sg-sub {
    margin: 36px 0 14px;
    display: flex; align-items: baseline; gap: 12px;
  }
  .sg-sub h3 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 17px; letter-spacing: -0.015em;
    color: var(--ink); margin: 0;
  }
  .sg-sub .tag {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--ink-3); letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Notes (flex / when in doubt) */
  .sg-note {
    font-family: var(--font-math);
    font-size: 14px; line-height: 1.55;
    color: var(--ink-2);
    padding: 14px 18px 14px 16px;
    border-left: 2px solid var(--ink-4);
    background: var(--bg-2);
    border-radius: 0 4px 4px 0;
    margin: 18px 0;
  }
  .sg-note strong {
    font-family: var(--font-sans); font-weight: 500;
    font-style: normal;
  }

  /* "Stage" — the live preview frame */
  .sg-stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin: 18px 0;
    position: relative;
  }
  .sg-stage.is-roomy { padding: 36px; }
  .sg-stage .stage-tag {
    position: absolute; top: 12px; right: 14px;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-4);
  }
  .sg-stage.is-paper { background: var(--bg); }

  /* Token list */
  .tok-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 14px;
  }
  .tok-table th, .tok-table td {
    text-align: left;
    padding: 7px 14px 7px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .tok-table th {
    font-weight: 500;
    color: var(--ink-3);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-bottom: 9px;
  }
  .tok-table td.name { color: var(--ink); }
  .tok-table td.val  { color: var(--ink-2); }
  .tok-table td.note { color: var(--ink-3); font-family: var(--font-math); font-size: 13px; }
  .tok-chip {
    display: inline-block; width: 14px; height: 14px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(22,22,20,0.10);
    vertical-align: middle;
    margin-right: 8px;
  }

  /* —— Color swatch grids —— */
  .palette-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .pal-cell {
    display: flex; flex-direction: column;
    gap: 6px;
    align-items: stretch;
  }
  .pal-cell .chip {
    height: 78px;
    border-radius: var(--radius);
    box-shadow: inset 0 0 0 1px rgba(22,22,20,0.10);
  }
  .pal-cell .role {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .pal-cell .hex {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-3);
  }

  /* Vector accent palette block */
  .v-pal {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .v-pal .v-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .v-pal .row {
    display: flex; align-items: center; gap: 12px;
  }
  .v-pal .solid {
    width: 44px; height: 44px; border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(22,22,20,0.10);
  }
  .v-pal .wash {
    width: 16px; height: 44px; border-radius: 4px;
    border: 1px solid var(--line-2);
  }
  .v-pal .role {
    font-family: var(--font-math); font-style: italic;
    font-size: 19px; color: var(--ink); line-height: 1;
  }
  .v-pal .role sub { font-size: 11px; font-style: italic; }
  .v-pal .label {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-3); margin-top: 2px;
  }
  .v-pal .hex {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-2);
  }
  .v-pal .desc {
    font-family: var(--font-math); font-size: 12.5px;
    color: var(--ink-3); line-height: 1.4;
  }

  /* —— Type specimens —— */
  .typespec {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 28px;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
  }
  .typespec:last-of-type { border-bottom: none; }
  .typespec .meta {
    display: flex; flex-direction: column; gap: 4px;
  }
  .typespec .family {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 16px; color: var(--ink); letter-spacing: -0.01em;
  }
  .typespec .usage {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-3); letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .typespec .pairs {
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--ink-2); margin-top: 6px;
    line-height: 1.6;
  }
  .typespec .sample-stack {
    display: flex; flex-direction: column; gap: 4px;
  }
  .typespec .display    { font-size: 38px; line-height: 1.05; letter-spacing: -0.025em; }
  .typespec .h1         { font-size: 28px; line-height: 1.1;  letter-spacing: -0.02em; }
  .typespec .body       { font-size: 15px; line-height: 1.5; }
  .typespec .micro      { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  .typespec.geist *     { font-family: var(--font-sans); }
  .typespec.mono *      { font-family: var(--font-mono); }
  .typespec.math *      { font-family: var(--font-math); font-style: italic; }
  .typespec.math .body  { font-style: normal; } /* roman for body math */
  .typespec.math .display { font-style: italic; }

  .scale-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
  }
  .scale-table td {
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    vertical-align: baseline;
  }
  .scale-table td:first-child {
    width: 160px;
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--ink-3); letter-spacing: 0.02em;
  }
  .scale-table td:last-child {
    color: var(--ink);
  }

  /* —— Label specimens —— */
  .lbl-eyebrow {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .lbl-math {
    font-family: var(--font-math); font-style: italic;
    font-size: 18px; color: var(--ink);
  }
  .lbl-math .sub { font-style: italic; font-size: 12px; }
  .lbl-math .ind { font-family: var(--font-mono); font-style: normal; font-size: 11px; }

  /* —— Slider control replica —— */
  .sg-controls {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .ctl-row {
    display: grid;
    grid-template-columns: 86px 1fr 1fr;
    align-items: center;
    gap: 18px;
  }
  .ctl-name {
    display: flex; align-items: baseline; gap: 8px;
  }
  .ctl-name .nm {
    font-family: var(--font-math); font-style: italic;
    font-size: 15px; color: var(--ink);
  }
  .ctl-name .swatch {
    width: 9px; height: 9px; border-radius: 50%;
    display: inline-block;
    box-shadow: inset 0 0 0 1px rgba(22,22,20,0.18);
  }
  .ctl-axis {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-math); font-style: italic;
    color: var(--ink-3); font-size: 12.5px;
  }
  .ctl-axis .lbl { width: 10px; }
  .num-input {
    width: 56px;
    padding: 4px 8px;
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--ink);
    text-align: right;
  }
  .num-track {
    flex: 1;
    height: 4px; border-radius: 999px;
    background: var(--bg-3);
    position: relative;
  }
  .num-track .fill {
    position: absolute; top: 0; bottom: 0; left: 0;
    background: var(--ink);
    border-radius: 999px;
  }
  .num-track .knob {
    position: absolute; top: 50%;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--panel); border: 1.5px solid var(--ink);
    transform: translate(-50%, -50%);
  }

  /* —— Dimension toggle replica —— */
  .dim-toggle {
    display: inline-flex; padding: 2px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px;
    flex-shrink: 0;
  }
  .dim-toggle button {
    padding: 4px 14px; border-radius: 5px;
    font-family: var(--font-math); font-style: italic;
    font-size: 13.5px; color: var(--ink-2);
    background: transparent; border: none; cursor: pointer;
  }
  .dim-toggle button.is-on {
    background: var(--panel); color: var(--ink);
    box-shadow: 0 1px 0 var(--line-2), 0 1px 3px rgba(31,31,28,0.04);
  }
  .dim-toggle button sup { font-style: normal; font-family: var(--font-mono); font-size: 10px; margin-left: 1px; }

  /* —— Gallery anatomy —— */
  .anat-gallery {
    background: var(--bg);
    border-radius: var(--radius-lg);
    padding: 36px 36px 24px;
    border: 1px solid var(--line);
  }
  .anat-gallery h1 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 34px; letter-spacing: -0.025em;
    margin: 8px 0 10px; line-height: 1.1; color: var(--ink);
  }
  .anat-gallery .eyebrow {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.10em; text-transform: uppercase; color: var(--ink-3);
  }
  .anat-gallery .sub {
    color: var(--ink-2); font-size: 15px; line-height: 1.6;
    max-width: 64ch; margin: 0 0 24px;
    font-family: var(--font-math);
  }

  .anat-card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .anat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .anat-card .preview {
    height: 130px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px;
  }
  .anat-card .body {
    padding: 14px 16px 16px;
    display: flex; flex-direction: column;
    gap: 8px; flex: 1;
  }
  .anat-card .title {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 17px; letter-spacing: -0.015em;
    color: var(--ink); line-height: 1.15;
  }
  .anat-card .tease {
    font-family: var(--font-math); font-size: 13px;
    color: var(--ink-2); line-height: 1.45;
    margin: 0;
  }
  .anat-card .foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto;
    padding-top: 8px;
  }
  .dim-row { display: flex; gap: 6px; }
  .dim-chip {
    font-family: var(--font-math);
    font-style: italic; font-size: 11.5px;
    color: var(--ink-2);
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    padding: 1px 7px 2px;
    border-radius: 4px;
  }
  .dim-chip sup { font-style: normal; font-family: var(--font-mono); font-size: 9px; margin-left: 1px; }

  /* Annotation callout overlay (gallery/concept anatomy) */
  .annot-layer {
    position: relative;
  }
  .annot {
    position: absolute;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: 0.04em; color: var(--ink-3);
    pointer-events: none;
  }
  .annot .num {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-family: var(--font-sans); font-size: 10px; font-weight: 500;
  }
  .annot-list {
    margin-top: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .annot-list .item {
    display: flex; align-items: baseline; gap: 12px;
    font-family: var(--font-math);
    font-size: 14px; color: var(--ink-2);
    line-height: 1.45;
  }
  .annot-list .item .num {
    flex-shrink: 0;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-family: var(--font-sans); font-size: 10px; font-weight: 500;
    align-self: flex-start;
    transform: translateY(2px);
  }
  .annot-list .item .term {
    font-family: var(--font-sans); font-weight: 500;
    color: var(--ink); font-size: 13.5px;
    font-style: normal;
  }
  .annot-list .item .term::after {
    content: " — ";
    color: var(--ink-3);
  }

  /* —— Concept page anatomy —— */
  .anat-cp {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .cp-top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .cp-top .back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-3);
    padding: 5px 10px 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--line-2);
    background: var(--panel);
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cp-top .crumb {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cp-top h1 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 22px; letter-spacing: -0.02em;
    margin: 0; color: var(--ink); line-height: 1;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cp-top .spacer { flex: 1; min-width: 16px; }

  .cp-body {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 18px;
    padding: 18px 24px 22px;
  }
  .cp-stage-col {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .stage-viz {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .stage-viz .vh {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    font-family: var(--font-math); font-style: italic;
    font-size: 13px; color: var(--ink-2);
  }
  .stage-viz .vh .grow { flex: 1; }
  .stage-viz .vh .ico {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    color: var(--ink-3); border-radius: 4px;
    font-size: 13px;
    background: transparent; border: none;
  }
  .stage-viz .canvas {
    background: var(--panel);
    padding: 10px;
    min-height: 240px;
    flex: 1;
  }
  .stage-controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px 18px 16px;
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .panel-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .panel-card .h {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 8px;
  }
  .panel-card h3 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: 17px; letter-spacing: -0.015em;
    margin: 0 0 10px; color: var(--ink);
  }
  .panel-card p {
    font-family: var(--font-math);
    font-size: 14.5px; line-height: 1.55;
    color: var(--ink); margin: 0 0 12px;
  }
  .panel-card .stmt {
    background: var(--bg-2);
    border-radius: 5px;
    padding: 12px 14px;
    font-family: var(--font-math);
    font-size: 14px; line-height: 1.4;
    color: var(--ink);
    text-align: center;
    margin-top: 4px;
  }
  .panel-card .cite {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.02em;
    margin-top: 12px;
  }

  /* —— Viz SVG (shared) —— */
  .viz-svg { width: 100%; height: 100%; display: block; }
  .viz-svg .grid-fine { stroke: var(--line); stroke-width: 0.4; fill: none; }
  .viz-svg .grid-major { stroke: var(--line-2); stroke-width: 0.6; fill: none; }
  .viz-svg .axis { stroke: var(--ink-3); stroke-width: 1; }
  .viz-svg .tick-label { font-family: var(--font-mono); font-size: 9px; fill: var(--ink-4); }
  .viz-svg .span-strip-1 { fill: var(--v1-wash); stroke: var(--v1-edge); stroke-width: 0.6; }
  .viz-svg .span-strip-2 { fill: var(--v2-wash); stroke: var(--v2-edge); stroke-width: 0.6; }
  .viz-svg .vec-arrow { stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .viz-svg .vec-arrow.b1 { stroke: var(--v1); }
  .viz-svg .vec-arrow.b2 { stroke: var(--v2); }
  .viz-svg .vec-arrow.p  { stroke: var(--vp); stroke-dasharray: 5 3; stroke-width: 1.9; }
  .viz-svg .tip { font-family: var(--font-math); font-style: italic; font-size: 13px; }
  .viz-svg .tip.t1 { fill: var(--v1); }
  .viz-svg .tip.t2 { fill: var(--v2); }
  .viz-svg .tip.tp { fill: var(--vp); }
  .viz-svg .tip.sub { font-size: 9px; font-style: normal; font-family: var(--font-mono); }
  .viz-svg .proj-p { stroke: var(--vp-edge); stroke-width: 0.8; fill: none; stroke-dasharray: 2 2.4; }

  /* mini viz for cards in gallery anatomy */
  .mini { display: block; width: 100%; height: 100%; }
  .mini .axis { stroke: var(--ink-4); stroke-width: 0.6; }
  .mini .vec   { stroke: var(--v1); stroke-width: 1.5; fill: none; }
  .mini .vec-2 { stroke: var(--v2); stroke-width: 1.5; fill: none; }
  .mini .vec-p { stroke: var(--vp); stroke-width: 1.4; fill: none; stroke-dasharray: 4 2.4; }
  .mini .dot   { fill: var(--v1); }
  .mini .dot-2 { fill: var(--v2); }
  .mini .dot-p { fill: var(--vp); }
  .mini .label { font-family: var(--font-math); font-style: italic; font-size: 9px; }
  .mini .label.l1 { fill: var(--v1); }
  .mini .label.l2 { fill: var(--v2); }
  .mini .label.lp { fill: var(--vp); }
  .mini .ribbon { fill: var(--v1-wash); stroke: var(--v1-edge); stroke-width: 0.6; }

  /* Code snippets */
  pre.snip {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 11.5px; line-height: 1.55;
    color: var(--ink);
    overflow-x: auto;
    margin: 12px 0 0;
    white-space: pre;
  }
  pre.snip .c { color: var(--ink-3); }
  pre.snip .k { color: var(--v2); }
  pre.snip .v { color: var(--v1); }

</style>
</head>

  function LabelsSection() {

              <div className="knob" style={{ left: `${a.pct}%` }} />
            </div>
          </div>

      </div>

            <CtlRow name="b<span style='font-size:0.7em;vertical-align:sub'>2</span>"

        <table className="tok-table">
          <thead><tr><th style={{width:'22%'}}>Part</th><th style={{width:'30%'}}>Spec</th><th>Notes</th></tr></thead>
          <tbody>
            <tr><td className="name">Row grid</td><td className="val">86 px name · 1fr axis · 1fr axis (extend per dim)</td><td className="note">Each row keeps name column fixed so rows align across the panel.</td></tr>
            <tr><td className="name">Swatch dot</td><td className="val">9 px circle, vector-color fill, 1 px inset shadow</td><td className="note">Always set to the same color the vector is drawn in.</td></tr>
            <tr><td className="name">Variable name</td><td className="val">STIX italic, 15 px, --ink</td><td className="note">Subscripts italic STIX. Composite expressions wrap to two lines if needed.</td></tr>
            <tr><td className="name">Axis label</td><td className="val">STIX italic, 12.5 px, --ink-3</td><td className="note">Single character (x, y, z, t…). Sits left of the input.</td></tr>
            <tr><td className="name">Numeric input</td><td className="val">56 px wide, 12.5 px Geist Mono, tabular-nums, right-aligned</td><td className="note">--bg-2 fill, --line-2 border, 4 px radius. Source of truth — the track is a view onto it.</td></tr>
            <tr><td className="name">Track</td><td className="val">4 px tall, 999 px radius, --bg-3</td><td className="note">Fill in --ink up to current value. The track stays ink, not vector color — vector color belongs to the swatch.</td></tr>

          </tbody>
        </table>

        <div className="sg-note">
          <strong>When in doubt.</strong> One numeric input per axis, one row per
          variable. If a variable is one-dimensional (a scalar), use a single axis.
          If it's three-dimensional, add a third axis cell — the grid extends.
        </div>
      </section>
    );
  }

  // === 05 · DIMENSION TOGGLE =================================================
  function DimToggleSection() {
    const [dim, setDim] = React.useState(2);
    return (
      <section className="sg-section" id="s-05">
        <header>
          <span className="num">05 · Controls</span>
          <h2>Dimension toggle</h2>
          <p>

            Lives in the top-right of the concept page header and stays the same
            shape wherever ambient dimension matters.
          </p>
        </header>

        <div className="sg-stage" style={{ display:'flex', gap: 24, alignItems:'center' }}>
          <span className="stage-tag">live</span>
          <div className="dim-toggle">
            <button className={dim === 2 ? 'is-on' : ''} onClick={() => setDim(2)}>R<sup>2</sup></button>
            <button className={dim === 3 ? 'is-on' : ''} onClick={() => setDim(3)}>R<sup>3</sup></button>
          </div>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--ink-3)', letterSpacing:'0.04em' }}>
            currently · <span style={{ color:'var(--ink)' }}>R<sup>{dim}</sup></span>
          </div>
        </div>

        <table className="tok-table">
          <tbody>
            <tr><td className="name">Container</td><td className="val">2 px padding, --bg-2, 1 px --line, 7 px radius</td><td className="note">Inline-flex; segments butt against each other.</td></tr>
            <tr><td className="name">Segment</td><td className="val">STIX italic, 13.5 px, 4×14 px padding, 5 px radius</td><td className="note">Active: --panel bg, --ink text, soft 1 px shadow. Inactive: transparent bg, --ink-2 text.</td></tr>

          <strong>Flexible.</strong> The same shape extends to other binary or small-N
          switches — fields (ℝ / ℂ), choice between two visualizations, "exact /
          approximate" — by swapping the segment labels. Keep the same chrome.
        </div>
      </section>
    );
  }

  // === 06 · GALLERY ==========================================================

            title → optional subhead → grid.
          </p>
        </header>

        <div className="sg-sub"><h3>Header hierarchy</h3><span className="tag">eyebrow · title · subhead</span></div>
        <div className="sg-stage is-roomy is-paper">
          <span className="stage-tag">live</span>
          <div className="anat-gallery" style={{ borderColor: 'transparent', padding: '8px 0 0' }}>
            <div className="eyebrow">Eyebrow · short context</div>
            <h1>Page title</h1>
            <p className="sub">
              Optional one-paragraph subhead in STIX. Sets up what the page is about,
              what to expect from the cards, and how the user should pick one.
            </p>
          </div>
        </div>

        <table className="tok-table">
          <tbody>
            <tr><td className="name">Eyebrow</td><td className="val">Geist Mono · 11 px · +0.10em · UPPERCASE · --ink-3</td><td className="note">Sits ~8 px above title. Optional.</td></tr>
            <tr><td className="name">Title</td><td className="val">Geist 500 · 34 px · −0.025em · --ink</td><td className="note">Shorter than a sentence. No period.</td></tr>

          <div className="annot-layer">

              <div className="anat-card">
                <div className="preview"><MiniBasis /></div>
                <div className="body">

                  <p className="tease">

                    every point unique coordinates.

                    <div className="dim-row">
                      <span className="dim-chip">R<sup>2</sup></span>
                      <span className="dim-chip">R<sup>3</sup></span>
                    </div>
                  </div>
                </div>
              </div>
              <div className="anat-card">
                <div className="preview"><MiniSpan /></div>
                <div className="body">
                  <div className="title">Span</div>
                  <p className="tease">
                    The set of all linear combinations of a set of vectors — the
                    subspace they generate.
                  </p>
                  <div className="foot">
                    <div className="dim-row">
                      <span className="dim-chip">R<sup>2</sup></span>
                      <span className="dim-chip">R<sup>3</sup></span>
                    </div>
                  </div>
                </div>
              </div>

                <div className="preview"><MiniVectors /></div>

                    <div className="dim-row">
                      <span className="dim-chip">R<sup>2</sup></span>

        {Array.from({ length: 11 }, (_, i) => i).map(i => (

  function ConceptBodySection() {
    return (
      <section className="sg-section" id="s-08">
        <header>
          <span className="num">08 · Pages</span>
          <h2>Concept page · Body</h2>
          <p>
            The concept page is a two-column grid: a stage column on the left, a

          <span className="stage-tag">live</span>

              <a className="back" href="#">← Concepts</a>

                  <div className="stmt">

          </tbody>
        </table>
      </section>
    );
  }
